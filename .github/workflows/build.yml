name: Build Icelandic ROM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build-modern:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 1
      COMPARE: 0
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev python3

      - name: Run Icelandic translation tests
        run: |
          python3 -m unittest tools.icelandic.test_translation_sanity
          python3 tools/icelandic/check_terms.py --root .

      - name: Build modern FireRed
        run: |
          make modern -j"$(nproc)"
