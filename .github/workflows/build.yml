name: Build Icelandic ROM

on:
  push:
    branches:
      - pokefirered-icelandic
  pull_request:

jobs:
  build-modern:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev python3

      - name: Check Icelandic terminology
        run: |
          python3 tools/icelandic/check_terms.py --root .

      - name: Build modern FireRed
        run: |
          make modern -j"$(nproc)"
